server {
 listen 8080; root /usr/share/nginx/html; client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location = /config.js { add_header Cache-Control "no-store"; }
 location /api/automation/ { proxy_pass http://automation-platform:8083/api/; proxy_read_timeout 90s; }
 location / { try_files $uri $uri/ /index.html; }
}
